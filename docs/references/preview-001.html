<div id="spestovnik-preview-v001" lang="bg">
<style>
#spestovnik-preview-v001{font-family:Arial,Helvetica,sans-serif;color:#23352a;--forest:#145823;--green:#246d35;--orange:#ff850b;--line:#e4e9e2;--soft:#f4f7f1;--ink:#23352a;--sub:#667368;line-height:1.4}
#spestovnik-preview-v001 *{box-sizing:border-box}
#spestovnik-preview-v001 button,#spestovnik-preview-v001 input{font:inherit}
#spestovnik-preview-v001 button{cursor:pointer}
#spestovnik-preview-v001 button:focus-visible,#spestovnik-preview-v001 input:focus-visible{outline:3px solid #1684ad;outline-offset:3px}
#spestovnik-preview-v001 .stage{display:grid;grid-template-columns:minmax(0,420px) minmax(180px,1fr);gap:24px;align-items:start;padding-top:8px}
#spestovnik-preview-v001 .phone{background:#f6f8f3;border:1px solid #d7dfd4;border-radius:26px;overflow:hidden;box-shadow:0 9px 30px #14362018;min-width:0}
#spestovnik-preview-v001 .top{background:linear-gradient(130deg,#174e1d,#207338);padding:18px 17px 16px;color:white;display:flex;gap:10px;align-items:center}
#spestovnik-preview-v001 .logo{width:40px;height:58px;object-fit:contain;border-radius:9px;flex:none}
#spestovnik-preview-v001 .brand{font-size:23px;font-weight:700;letter-spacing:-.6px}
#spestovnik-preview-v001 .tagline{font-size:11px;opacity:.86;margin-top:3px}
#spestovnik-preview-v001 .brandblock{flex:1;min-width:0}
#spestovnik-preview-v001 .basket-top{position:relative;background:#ffffff16;color:white;border:1px solid #ffffff40;border-radius:12px;min-width:43px;min-height:43px;display:grid;place-items:center}
#spestovnik-preview-v001 .count{position:absolute;top:-6px;right:-5px;background:var(--orange);color:white;border-radius:20px;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center;font-weight:700}
#spestovnik-preview-v001 .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#eaf0de;border-bottom:1px solid #dce4d3}
#spestovnik-preview-v001 .tab{border:0;border-right:1px solid #d7e0cc;color:#27562e;min-height:64px;padding:9px 2px 7px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}
#spestovnik-preview-v001 .tab:last-child{border-right:0}
#spestovnik-preview-v001 .tab[aria-selected=true]{background:var(--orange);color:white}
#spestovnik-preview-v001 i{display:inline-flex}
#spestovnik-preview-v001 svg{width:20px;height:20px;flex:none}
#spestovnik-preview-v001 .location-wrap{padding:13px 13px 0;background:white}
#spestovnik-preview-v001 .location-trigger{width:100%;border:1px solid #d9e0d6;border-radius:13px;background:white;min-height:49px;padding:9px 12px;display:flex;align-items:center;gap:9px;text-align:left}
#spestovnik-preview-v001 .location-trigger .grow{flex:1}
#spestovnik-preview-v001 .loc-caption{font-size:11px;letter-spacing:.8px;color:var(--sub);text-transform:uppercase}
#spestovnik-preview-v001 .loc-name{font-size:14px;font-weight:700;color:#1d4325}
#spestovnik-preview-v001 .location-panel{padding:12px 0 2px}
#spestovnik-preview-v001 [hidden]{display:none!important}
#spestovnik-preview-v001 .mode{display:flex;gap:8px;margin-bottom:10px}
#spestovnik-preview-v001 .mode label{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;padding:9px 5px;background:#f3f6f0;border:1px solid #dce4d7;border-radius:10px;color:#2c4a32;min-height:42px}
#spestovnik-preview-v001 .mode label:has(input:checked){background:#fff2e3;border-color:var(--orange)}
#spestovnik-preview-v001 input[type=radio],#spestovnik-preview-v001 input[type=checkbox]{accent-color:#247335;width:17px;height:17px;flex:none}
#spestovnik-preview-v001 .searchbox{display:flex;align-items:center;gap:8px;border:1px solid #d5ddd0;border-radius:12px;background:white;padding:0 11px;min-height:45px}
#spestovnik-preview-v001 .searchbox svg{width:18px;height:18px;color:#6f7e6d}
#spestovnik-preview-v001 .searchbox input{width:100%;min-width:0;border:0;background:transparent;padding:11px 0;color:var(--ink);font-size:14px;outline-offset:1px}
#spestovnik-preview-v001 .clear{border:0;background:transparent;color:var(--sub);padding:6px;font-size:19px;line-height:1}
#spestovnik-preview-v001 .loc-option{display:flex;gap:10px;align-items:center;min-height:53px;width:100%;border:0;border-bottom:1px solid #edf0e8;background:white;text-align:left;padding:8px 7px;color:var(--ink)}
#spestovnik-preview-v001 .loc-option[aria-selected=true]{background:#edf5e5;border-radius:9px;color:#246235}
#spestovnik-preview-v001 .loc-option .grow{flex:1}
#spestovnik-preview-v001 .meta{font-size:11px;color:var(--sub);margin-top:3px}
#spestovnik-preview-v001 .body{padding:14px 13px 18px;background:white;min-height:380px}
#spestovnik-preview-v001 .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#spestovnik-preview-v001 .section-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
#spestovnik-preview-v001 .mini{font-size:11px;color:var(--sub)}
#spestovnik-preview-v001 .subnav{display:flex;border-bottom:1px solid var(--line);margin-bottom:13px;gap:15px}
#spestovnik-preview-v001 .subnav button{border:0;background:white;color:var(--sub);padding:0 0 10px;font-size:12px;border-bottom:2px solid transparent}
#spestovnik-preview-v001 .subnav button[aria-pressed=true]{color:var(--green);border-bottom-color:var(--orange);font-weight:700}
#spestovnik-preview-v001 .status-line{font-size:11px;color:#886329;background:#fff7e8;padding:7px 9px;border-radius:8px;margin:11px 0 12px;display:flex;gap:6px;align-items:flex-start}
#spestovnik-preview-v001 .status-line svg{height:14px;width:14px;margin-top:1px}
#spestovnik-preview-v001 .product-search{margin-top:12px}
#spestovnik-preview-v001 .product-options{border:1px solid var(--line);border-radius:12px;margin-top:7px;padding:4px 9px 9px;background:#fff;box-shadow:0 5px 12px #203f2110}
#spestovnik-preview-v001 .product-option{display:flex;align-items:center;gap:9px;min-height:49px;border-bottom:1px solid #f0f2ec;font-size:13px}
#spestovnik-preview-v001 .product-option img{width:25px;height:35px;object-fit:contain}
#spestovnik-preview-v001 .actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}
#spestovnik-preview-v001 .primary{border:0;border-radius:10px;background:var(--orange);color:white;padding:10px 13px;font-size:12px;font-weight:700;min-height:42px}
#spestovnik-preview-v001 .secondary{border:1px solid #cbd8c9;border-radius:10px;background:white;color:var(--green);padding:9px 11px;font-size:12px;min-height:42px}
#spestovnik-preview-v001 .text-button{border:0;background:transparent;color:var(--green);font-size:12px;padding:9px 2px;min-height:40px}
#spestovnik-preview-v001 .product-list{display:grid;gap:10px;margin-top:12px}
#spestovnik-preview-v001 .product{display:flex;align-items:center;gap:12px;border:1px solid #e1e7dc;border-radius:14px;padding:12px 11px;background:white;box-shadow:0 2px 5px #163a1810;min-height:128px}
#spestovnik-preview-v001 .product-photo{width:64px;height:91px;object-fit:contain;flex:none;background:white}
#spestovnik-preview-v001 .product-info{flex:1;min-width:0}
#spestovnik-preview-v001 .product-name{font-size:14px;font-weight:700;line-height:1.28}
#spestovnik-preview-v001 .package{font-size:12px;color:var(--sub);margin-top:4px}
#spestovnik-preview-v001 .tag{display:inline-flex;font-size:11px;letter-spacing:.6px;font-weight:700;color:#62765d;background:#eef3e8;border-radius:5px;padding:3px 5px;margin-bottom:5px}
#spestovnik-preview-v001 .price-missing{font-size:11px;color:#697568;margin-top:10px;max-width:145px}
#spestovnik-preview-v001 .add{align-self:flex-end;width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid #ffac50;border-radius:50%;background:white;color:#ee7d0b}
#spestovnik-preview-v001 .add svg{width:18px;height:18px}
#spestovnik-preview-v001 .added{background:#f0f7e9;border-color:#a3c88c;color:var(--green)}
#spestovnik-preview-v001 .store{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#spestovnik-preview-v001 .store-mark{width:41px;height:41px;background:#edf3e8;border-radius:10px;display:grid;place-items:center;color:var(--green);flex:none}
#spestovnik-preview-v001 .store-name{font-size:14px;font-weight:700}
#spestovnik-preview-v001 .store-address{font-size:12px;color:#5a6b5c;margin-top:3px}
#spestovnik-preview-v001 .availability{font-size:11px;color:#8c693d;margin-top:7px}
#spestovnik-preview-v001 .fuel-switch{display:flex;background:#f1f4ed;border:1px solid #e1e7dc;border-radius:12px;margin-bottom:12px;overflow:hidden}
#spestovnik-preview-v001 .fuel-switch button{flex:1;min-height:44px;background:transparent;border:0;color:#4f6250;font-size:12px;padding:8px 2px}
#spestovnik-preview-v001 .fuel-switch button[aria-pressed=true]{background:var(--orange);color:white;border-radius:10px;font-weight:700}
#spestovnik-preview-v001 .empty{padding:27px 12px;text-align:center;color:#667565;background:#f7f9f4;border-radius:13px;font-size:13px;margin-top:14px}
#spestovnik-preview-v001 .empty strong{display:block;color:#304f35;margin:8px 0 5px;font-size:14px}
#spestovnik-preview-v001 .bottom{display:flex;border-top:1px solid #dfe6d9;background:#f4f7ef;padding:9px 12px;gap:8px}
#spestovnik-preview-v001 .bottom button{flex:1;min-width:0;min-height:40px;display:flex;gap:7px;justify-content:center;align-items:center;border:0;background:transparent;color:#35613b;font-size:11px}
#spestovnik-preview-v001 .bottom svg{width:18px;height:18px}
#spestovnik-preview-v001 .back{border:0;padding:6px 0 10px;background:white;color:var(--green);font-size:12px;min-height:36px}
#spestovnik-preview-v001 .basket-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
#spestovnik-preview-v001 .basket-item img{width:35px;height:50px;object-fit:contain}
#spestovnik-preview-v001 .qty{display:flex;align-items:center;gap:9px;margin-top:7px}
#spestovnik-preview-v001 .qty button{width:30px;height:30px;border-radius:7px;border:1px solid #d7e0d0;background:white;color:var(--green)}
#spestovnik-preview-v001 .scan-option{display:flex;width:100%;text-align:left;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:white;padding:15px 12px;margin-top:12px;color:var(--ink)}
#spestovnik-preview-v001 .scan-option svg{width:25px;height:25px;color:var(--green)}
#spestovnik-preview-v001 .check-row{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding:12px 0;font-size:12px}
#spestovnik-preview-v001 .check-state{color:var(--green);font-size:11px;white-space:nowrap;min-width:51px}
#spestovnik-preview-v001 .check-state.pending{color:#9e6e29}
#spestovnik-preview-v001 .toast{font-size:12px;background:#eaf4df;color:#28572c;border-radius:8px;padding:8px 10px;margin-top:10px}
#spestovnik-preview-v001 .rail{padding:12px 0 0;color:#294430;font-size:13px;min-width:0}
#spestovnik-preview-v001 .version{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#697b66;margin-bottom:8px}
#spestovnik-preview-v001 .rail-title{font-size:21px;letter-spacing:-.4px;font-weight:700;line-height:1.2;margin-bottom:12px}
#spestovnik-preview-v001 .rail p{font-size:12px;line-height:1.6;color:#687564;margin:0 0 16px}
#spestovnik-preview-v001 .steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#spestovnik-preview-v001 .steps button{width:100%;background:transparent;border:0;border-bottom:1px solid #dce5d5;padding:10px 0;display:flex;align-items:center;gap:10px;text-align:left;color:#315c39;font-size:12px;min-height:45px}
#spestovnik-preview-v001 .step-no{color:#76926b;font-size:11px;width:18px;flex:none}
#spestovnik-preview-v001 .snapshot{font-size:11px;color:#74816d;padding-top:17px;line-height:1.6}
#spestovnik-preview-v001 .rail-check{margin-top:15px;border:1px solid #cfddc6;background:transparent;color:#32603c;border-radius:10px;font-size:12px;padding:10px 12px;min-height:42px}
#spestovnik-preview-v001 .rail small{display:block;font-size:11px;line-height:1.5;color:#74816d;margin-top:13px}
@media(max-width:570px){#spestovnik-preview-v001 .stage{grid-template-columns:minmax(0,420px);justify-content:center;gap:15px}#spestovnik-preview-v001 .rail{order:-1;padding:0}#spestovnik-preview-v001 .rail-title{font-size:18px;margin-bottom:7px}#spestovnik-preview-v001 .rail p{margin:0 0 8px}#spestovnik-preview-v001 .steps{display:flex;flex-wrap:wrap;gap:5px}#spestovnik-preview-v001 .steps button{min-height:36px;width:auto;border:1px solid #dce5d5;border-radius:8px;padding:6px 8px;font-size:11px}#spestovnik-preview-v001 .step-no{width:auto}#spestovnik-preview-v001 .snapshot{padding-top:8px}#spestovnik-preview-v001 .rail-check{margin-top:8px}#spestovnik-preview-v001 .rail small{display:none}#spestovnik-preview-v001 .brand{font-size:21px}}
</style>

<script>
(()=>{
 const root=document.getElementById('spestovnik-preview-v001');
 const D=JSON.parse(root.querySelector('#spv1-data').textContent),A=JSON.parse(root.querySelector('#spv1-assets').textContent);
 const $=s=>root.querySelector(s),h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const products=D.demo.products.map(p=>({...p,name:p.name.replace(/^Демо:\s*/i,''),photo:A[p.id.replace('demo-','')]}));
 const categories={groceries:'Храни',fuel:'Горива',home:'Дом',technology:'Техника'};
 const retailers=new Map(D.catalog.retailers.map(r=>[r.code,r]));
 const defaultCity=D.localities.find(l=>l.name_bg==='Велико Търново')||D.localities[0];
 let S={category:'groceries',city:defaultCity?.id,mode:'name',screen:'catalog',view:'products',fuel:'Бензин 95',chosen:[],draft:[],basket:{},query:'',searchOpen:false,notice:''};
 function restore(saved){const p=saved?.privateContent;if(!p||p.version!=='v001')return;for(const k of ['category','city','mode','screen','view','fuel','chosen','draft','basket'])if(p[k]!==undefined)S[k]=p[k];if(!categories[S.category])S.category='groceries';if(!D.localities.some(l=>l.id===S.city))S.city=defaultCity?.id;S.basket=Object.fromEntries(Object.entries(S.basket||{}).filter(([id,q])=>products.some(p=>p.id===id)&&Number(q)>0).map(([id,q])=>[id,Math.min(99,Number(q))]));}
 restore(window.openai?.widgetState);
 function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'v001',category:S.category,locality:city()?.name_bg,basket:S.basket},privateContent:{version:'v001',category:S.category,city:S.city,mode:S.mode,screen:S.screen,view:S.view,fuel:S.fuel,chosen:S.chosen,draft:S.draft,basket:S.basket}}).catch(()=>{});}
 function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});}
 function city(){return D.localities.find(l=>l.id===S.city);}
 function stores(){return(city()?.stores||[]).filter(s=>retailers.get(s.retailer_code)?.category_code===S.category);}
 function announce(text){$('#spv1-announcer').textContent=text;}
 const back=()=>'<button class="back" data-a="catalog">‹ Обратно към '+h(categories[S.category])+'</button>';
 function renderLocations(){const q=$('#spv1-location-query').value.trim().toLocaleLowerCase('bg');const matches=D.localities.filter(l=>S.mode==='postal'?(l.postal_codes||[]).some(c=>c.startsWith(q)):l.name_bg.toLocaleLowerCase('bg').includes(q));$('#spv1-location-results').innerHTML=matches.map(l=>'<button class="loc-option" role="option" data-a="choose-city" data-id="'+h(l.id)+'" aria-selected="'+(l.id===S.city)+'"><span class="grow"><strong>'+h(l.name_bg)+'</strong><div class="meta">'+h(l.municipality+' · '+l.region+' · '+(l.postal_codes||[]).join(', '))+'</div></span>'+(l.id===S.city?'<i data-lucide="check" aria-hidden="true"></i>':'')+'</button>').join('')||'<div class="meta" style="padding:12px 4px">Няма съвпадение в тази снимка на данните.</div>';icons();}
 function renderSearchOptions(){const el=$('#spv1-product-options');if(!el)return;el.hidden=!S.searchOpen;const q=S.query.toLocaleLowerCase('bg');const found=products.filter(p=>p.name.toLocaleLowerCase('bg').includes(q));el.innerHTML=found.map(p=>'<label class="product-option"><input type="checkbox" data-product="'+h(p.id)+'" '+(S.draft.includes(p.id)?'checked':'')+'><img src="'+p.photo+'" alt=""><span>'+h(p.name)+'</span></label>').join('')+'<div class="actions"><button class="text-button" data-a="clear-products">Изчисти избора</button><button class="primary" data-a="apply-products">Приложи ('+S.draft.length+')</button></div>';if(!found.length)el.insertAdjacentHTML('afterbegin','<div class="meta" style="padding:9px 0">Няма съвпадение сред трите примерни продукта.</div>');}
 function productList(){return products.filter(p=>!S.chosen.length||S.chosen.includes(p.id)).map(p=>'<article class="product"><img class="product-photo" src="'+p.photo+'" alt="'+h(p.name)+' — примерна снимка"><div class="product-info"><span class="tag">ДЕМО СНИМКА</span><div class="product-name">'+h(p.name)+'</div><div class="package">'+h(p.package.replace('L','л').replace('kg','кг'))+'</div><div class="price-missing">Няма потвърдена цена</div></div><button class="add '+(S.basket[p.id]?'added':'')+'" data-a="add" data-id="'+h(p.id)+'" aria-label="Добави '+h(p.name)+' в списъка"><i data-lucide="'+(S.basket[p.id]?'check':'shopping-cart')+'" aria-hidden="true"></i></button></article>').join('');}
 function storeList(){const rows=stores();return rows.length?rows.map(s=>'<article class="store"><div class="store-mark"><i data-lucide="'+(S.category==='fuel'?'fuel':'store')+'" aria-hidden="true"></i></div><div><div class="store-name">'+h(s.branch_name||s.retailer_name)+'</div><div class="store-address">'+h(s.address)+'</div><div class="meta">'+h(s.locality_name)+'</div><div class="availability">Няма проверена '+(S.category==='fuel'?'цена за '+h(S.fuel):'оферта')+'</div></div></article>').join(''):'<div class="empty"><i data-lucide="store" aria-hidden="true"></i><strong>Няма заредени обекти</strong>В тази категория и населено място няма записи в снимката. Това не означава, че няма магазини.</div>';}
 function catalog(){let html='<div class="subnav"><button data-a="view-products" aria-pressed="'+(S.view==='products')+'">'+(S.category==='groceries'?'Продукти':'Каталог')+'</button><button data-a="view-stores" aria-pressed="'+(S.view==='stores')+'">Магазини ('+stores().length+')</button></div>';
 if(S.category==='fuel')html+='<div class="fuel-switch">'+['Бензин 95','Дизел','LPG'].map(f=>'<button data-a="fuel" data-id="'+f+'" aria-pressed="'+(f===S.fuel)+'">'+f+'</button>').join('')+'</div><div class="status-line"><i data-lucide="clock-3" aria-hidden="true"></i>Fuelo: очаква API достъп. Не се показват прогнозни или средни цени като цени на обект.</div>';
 if(S.view==='stores'||S.category==='fuel')return html+'<div class="row"><div class="section-title">'+(S.category==='fuel'?'Бензиностанции':'Магазини')+'</div><span class="mini">Регистрирани обекти</span></div>'+storeList();
 if(S.category!=='groceries')return html+'<div class="section-title">'+h(categories[S.category])+'</div><div class="empty"><i data-lucide="package-search" aria-hidden="true"></i><strong>Каталогът очаква данни</strong>Можете да проверите наличните регистрирани магазини.</div><button class="secondary" data-a="view-stores" style="margin-top:12px;width:100%">Виж магазини ('+stores().length+')</button>';
 return html+'<div class="row"><div class="section-title">Продукти</div><span class="mini">3 примерни снимки</span></div><div class="product-search"><label class="searchbox"><i data-lucide="search" aria-hidden="true"></i><input id="spv1-product-query" placeholder="Търси продукт…" value="'+h(S.query)+'" aria-label="Търсене на продукти" autocomplete="off"><button type="button" class="clear" data-a="reset-search" aria-label="Изчисти продуктовото търсене">×</button></label><div class="product-options" id="spv1-product-options" hidden></div></div><div class="status-line">Снимките са примерни. Проверени цени още не са заредени.</div><div class="product-list">'+productList()+'</div>';
 }
 function basket(){const rows=products.filter(p=>S.basket[p.id]);let html=back()+'<div class="row"><div class="section-title">Моят списък</div><span class="mini">'+rows.length+' продукта</span></div>';
 if(!rows.length)return html+'<div class="empty"><i data-lucide="shopping-basket" aria-hidden="true"></i><strong>Списъкът е празен</strong>Добавете примерен продукт от Храни.</div>';
 html+=rows.map(p=>'<article class="basket-item"><img src="'+p.photo+'" alt="'+h(p.name)+'"><div style="flex:1"><div class="product-name">'+h(p.name)+'</div><div class="package">Демо · '+h(p.package)+'</div><div class="qty"><button data-a="minus" data-id="'+p.id+'" aria-label="Намали количеството">−</button><span>'+S.basket[p.id]+'</span><button data-a="add" data-id="'+p.id+'" aria-label="Увеличи количеството">+</button><button data-a="remove" data-id="'+p.id+'" aria-label="Премахни продукта" style="margin-left:auto;border:0"><i data-lucide="trash-2" aria-hidden="true" style="width:15px"></i></button></div></div></article>').join('');
 return html+'<div class="row" style="margin-top:17px"><strong>Обща цена</strong><strong>—</strong></div><div class="meta">Няма цени за '+rows.length+' от '+rows.length+' продукта.</div><button class="primary" style="width:100%;margin-top:14px" data-a="compare">Сравни списъка</button>'+(S.notice?'<div class="status-line" role="status">'+h(S.notice)+'</div>':'');}
 function tools(){return back()+'<div class="section-title">Сканиране</div><button class="scan-option" data-a="barcode"><i data-lucide="scan-barcode" aria-hidden="true"></i><span><strong>Баркод на продукт</strong><div class="meta">Проверка на познат продукт</div></span></button><button class="scan-option" data-a="receipt"><i data-lucide="receipt-text" aria-hidden="true"></i><span><strong>Касова бележка</strong><div class="meta">Извличане и проверка на данни</div></span></button>'+(S.notice?'<div class="status-line" role="status">'+h(S.notice)+'</div>':'<div class="meta" style="margin-top:15px">Камерата и входът в профил не са свързани в този преглед.</div>');}
 function checks(){const facts=[['Работи','Четири таба','Смяна на категории с общо избрано място.'],['Работи','Местоположение','Търсене по име или пощенски код сред '+D.localities.length+' проверени места.'],['Работи','Магазини','Реални регистрирани обекти от снимката на API.'],['Работи','Продукти и списък','Филтриране, множествен избор, количества и премахване — локално в прегледа.'],['Демо','Снимки на продукти','Трите снимки са от демо каталога; няма потвърдени цени.'],['Очаква','Сравнение на цени','Не се изчислява измислена обща цена за непълен списък.'],['Очаква','Горива','Fuelo изисква API достъп и проверени връзки към обектите.'],['Не е свързано','Камера и профил','Баркод, бележки и вход са следващи интеграции на Android клиента.']];return back()+'<div class="section-title">Проверка на версия 01</div>'+facts.map(([status,name,detail])=>'<div class="check-row"><span class="check-state '+(status==='Работи'?'':'pending')+'">'+status+'</span><div><strong>'+name+'</strong><div class="meta">'+detail+'</div></div></div>').join('')+'<div class="meta" style="margin-top:12px">API '+h(D.version)+' · '+h(new Date(D.checked_at).toLocaleString('bg-BG',{timeZone:'Europe/Sofia'}))+'<br>Прегледът не изпраща данни и не актуализира автоматично снимката.</div>';}
 function render(){root.querySelectorAll('[name="spv1-mode"]').forEach(e=>e.checked=e.value===S.mode);$('#spv1-location-query').placeholder=S.mode==='postal'?'Търси пощенски код…':'Търси населено място…';root.querySelectorAll('[data-a=tab]').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.id===S.category)));$('#spv1-content').setAttribute('aria-labelledby','spv1-'+S.category);$('#spv1-location-name').textContent=city()?.name_bg||'Изберете място';$('#spv1-count').textContent=Object.values(S.basket).reduce((a,b)=>a+b,0);$('#spv1-content').innerHTML=S.screen==='basket'?basket():S.screen==='tools'?tools():S.screen==='checks'?checks():catalog();renderSearchOptions();icons();}
 root.addEventListener('click',event=>{const b=event.target.closest('[data-a]');if(!b||!root.contains(b))return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='location'||a==='step-location'){const panel=$('#spv1-location-panel');panel.hidden=a==='step-location'?false:!panel.hidden;$('.location-trigger').setAttribute('aria-expanded',String(!panel.hidden));renderLocations();if(!panel.hidden)$('#spv1-location-query').focus();return;}
 if(a==='choose-city'){S.city=id;$('#spv1-location-panel').hidden=true;$('.location-trigger').setAttribute('aria-expanded','false');announce('Избрано място: '+city().name_bg);}
 else if(a==='clear-location'){$('#spv1-location-query').value='';renderLocations();return;}
 else if(a==='tab'){S.category=id;S.screen='catalog';S.view=id==='groceries'?'products':'stores';S.notice='';}
 else if(a==='basket'||a==='tools'||a==='checks'){S.screen=a;S.notice='';}
 else if(a==='catalog'){S.screen='catalog';S.notice='';}
 else if(a==='view-products'){S.view='products';}
 else if(a==='view-stores'){S.view='stores';}
 else if(a==='fuel'){S.fuel=id;}
 else if(a==='step-stores'){S.category='fuel';S.view='stores';S.screen='catalog';}
 else if(a==='step-products'){S.category='groceries';S.view='products';S.screen='catalog';S.searchOpen=true;render();$('#spv1-product-query').focus();persist();return;}
 else if(a==='add'){S.basket[id]=Math.min(99,(S.basket[id]||0)+1);announce('Добавено в списъка: '+products.find(p=>p.id===id)?.name);}
 else if(a==='minus'){if(S.basket[id]>1)S.basket[id]--;else delete S.basket[id];}
 else if(a==='remove'){delete S.basket[id];}
 else if(a==='compare'){S.notice='Сравнението очаква проверени цени. Примерните продукти не са реални оферти.';}
 else if(a==='barcode'){S.notice='Android камерата още не е свързана. Backend разпознаването на баркодове е налично; реалният продуктов каталог все още е празен.';}
 else if(a==='receipt'){S.notice='Изисква вход и Android качване на снимка. Backend OCR е готов; този преглед не качва и не обработва бележки.';}
 else if(a==='clear-products'){S.draft=[];renderSearchOptions();persist();return;}
 else if(a==='apply-products'){S.chosen=[...S.draft];S.searchOpen=false;S.query='';}
 else if(a==='reset-search'){S.query='';S.draft=[];S.chosen=[];S.searchOpen=false;}
 render();persist();});
 root.addEventListener('input',e=>{if(e.target.id==='spv1-location-query')renderLocations();if(e.target.id==='spv1-product-query'){S.query=e.target.value;S.searchOpen=true;renderSearchOptions();}});
 root.addEventListener('focusin',e=>{if(e.target.id==='spv1-product-query'){S.searchOpen=true;renderSearchOptions();}});
 root.addEventListener('change',e=>{if(e.target.name==='spv1-mode'){S.mode=e.target.value;$('#spv1-location-query').value='';$('#spv1-location-query').placeholder=S.mode==='postal'?'Търси пощенски код…':'Търси населено място…';renderLocations();persist();}if(e.target.dataset.product){const id=e.target.dataset.product;S.draft=e.target.checked?[...new Set([...S.draft,id])]:S.draft.filter(x=>x!==id);renderSearchOptions();persist();}});
 root.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const tabs=[...root.querySelectorAll('[data-a=tab]')],i=tabs.indexOf(document.activeElement),next=tabs[(i+(e.key==='ArrowRight'?1:3))%4];next.focus();next.click();});
 window.addEventListener('openai:set_globals',event=>{restore(event.detail?.globals?.widgetState);render();});
 $('#spv1-snapshot').textContent='API '+D.version+' · снимка от '+new Date(D.checked_at).toLocaleString('bg-BG',{timeZone:'Europe/Sofia'})+' · '+D.localities.length+' населени места';
 render();renderLocations();
})();
</script>
</div>
