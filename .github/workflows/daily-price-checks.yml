name: Daily price source checks

on:
  workflow_dispatch:
    inputs:
      verify_publication:
        description: Check the production publisher configuration with a read-only query
        type: boolean
        default: false
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: daily-price-checks
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.verify_publication
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        category: [groceries, technology, fuel]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/check_daily_prices.py "${{ matrix.category }}" > price-source-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-check-${{ matrix.category }}
          path: price-source-report.json
          if-no-files-found: error
          retention-days: 30

  publication-config:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check publisher configuration without exposing credentials
        env:
          PRICE_REUSE_APPROVED_CATEGORIES: ${{ vars.PRICE_REUSE_APPROVED_CATEGORIES }}
          PRICE_PUBLISH_DATABASE_URL: ${{ secrets.PRICE_PUBLISH_DATABASE_URL }}
        run: |
          python - <<'PYTHON'
          import os
          import sys
          import psycopg

          url = os.environ.get("PRICE_PUBLISH_DATABASE_URL")
          categories = set(os.environ.get("PRICE_REUSE_APPROVED_CATEGORIES", "").split())
          print("Publisher connection configured:", bool(url))
          print("Grocery and technology publication enabled:", {"groceries", "technology"} <= categories)
          if not url or not {"groceries", "technology"} <= categories:
              sys.exit(1)
          try:
              with psycopg.connect(url, connect_timeout=8) as connection:
                  connection.execute("SET TRANSACTION READ ONLY")
                  row = connection.execute("""
                      SELECT has_table_privilege(current_user, 'national_offers', 'INSERT'),
                        count(*) FILTER (WHERE code IN ('t_market', 'techmart', 'ardes') AND active),
                        count(*) FILTER (WHERE code = 'bulmag' AND active)
                      FROM catalog_retailers
                  """).fetchone()
          except (psycopg.Error, ValueError) as exc:
              print("Publisher database check failed:", type(exc).__name__)
              sys.exit(1)
          can_insert, existing_retailers, bulmag = row
          print("Publisher insert privilege:", can_insert)
          print("Existing pilot retailers present:", existing_retailers, "of 3")
          print("BulMag retailer registered:", bool(bulmag))
          if not can_insert or existing_retailers != 3 or not bulmag:
              sys.exit(1)
          PYTHON
