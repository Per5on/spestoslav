name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sqlalchemy: ["2.0.*", "2.1.*"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: spestoslav_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/spestoslav_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install "SQLAlchemy==${{ matrix.sqlalchemy }}"
      - run: python -m compileall -q app migrations
      - run: pip install ruff==0.17.6 && ruff check --config ../ruff.toml app migrations tests ../scripts
      - run: python ../scripts/validate_inventory.py
      - run: PYTHONPATH=. pytest -q
