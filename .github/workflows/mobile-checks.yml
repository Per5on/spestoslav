name: Mobile source checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run mobile unit and regression tests
        run: npm test
      - name: TypeScript source checks
        run: npm run typecheck
