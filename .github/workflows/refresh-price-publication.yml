name: Refresh published prices

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */4 * * *'

permissions:
  contents: read

concurrency:
  group: price-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.PRICE_REUSE_APPROVED_CATEGORIES != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRICE_REUSE_APPROVED_CATEGORIES: ${{ vars.PRICE_REUSE_APPROVED_CATEGORIES }}
      PRICE_PUBLISH_DATABASE_URL: ${{ secrets.PRICE_PUBLISH_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.27,<1' 'psycopg[binary]>=3.2,<4'
      - name: Refresh approved categories and report coverage
        shell: bash
        run: |
          read -r -a categories <<< "$PRICE_REUSE_APPROVED_CATEGORIES"
          args=()
          for category in "${categories[@]}"; do
            args+=(--category "$category")
          done
          python scripts/refresh_live_prices.py "${args[@]}" --apply --cache "$RUNNER_TEMP/price-base.sqlite"
