name: Android preview APK
on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "Owner explicitly confirmed the Preview007 build after dry-test review"
        type: boolean
        default: false
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-preview.yml"]
permissions:
  contents: read
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_build == true
    outputs:
      preview_sequence: ${{ steps.preview.outputs.sequence }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://spestoslav-api.onrender.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Record post-preview branch and conditional release decision
        if: github.head_ref == 'Test_postpreview-005' || github.ref_name == 'Test_postpreview-005'
        run: |
          echo "Candidate branch: Test_postpreview-005; experimental post-preview source, NOT an approved Preview 005 or 006 release."
          echo "Preview 005 remains pending on PR #9. Owner may separately choose Preview 006 after three complete backend/frontend/native verification passes."
          echo "Never bypass Android 10 barcode assertions, rename a 005 APK as 006, or replace earlier numbered releases."
          {
            echo "### Post-preview release gate"
            echo "Branch: Test_postpreview-005 (experimental; no automatic release approval)."
            echo "Preview 005: independent pending verification on PR #9."
            echo "Preview 006: conditional owner decision after 3 full verification passes; fresh metadata/build required."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record Preview 006 development gate
        if: github.head_ref == 'codex/preview-006' || github.ref_name == 'codex/preview-006'
        run: |
          echo "Preview 006 is a development candidate; automatic publication is blocked until three verification passes are complete."
          echo "### Preview 006 development candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Build/test only. No numbered release until three complete verification passes and final source review." >> "$GITHUB_STEP_SUMMARY"
      - name: Read preview metadata
        id: preview
        run: node scripts/read-preview.cjs
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo install --check
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone preview APK (test signing)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Verify and name APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          cp "$APK" spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}.apk
          sha256sum spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}.apk > spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}.apk.sha256
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare synthetic barcode fixture
        run: |
          python -m pip install "Pillow>=13.0.0,<14"
          python ../scripts/generate_mock_images.py --output smoke-fixtures
          python -c "from PIL import Image; Image.open('smoke-fixtures/simulation-ean13.png').convert('RGB').save('smoke-fixtures/simulation-ean13.jpg', quality=100, subsampling=0)"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Smoke test on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          # Expo Camera's static ML Kit barcode decoder requires Google Play Services.
          # The plain AOSP `default` image lacks com.android.vending.
          target: google_apis_playstore
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb install mobile/spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}.apk
            adb shell mkdir -p /sdcard/Download
            adb push mobile/smoke-fixtures/simulation-ean13.jpg /sdcard/Download/spestovnik-simulation-ean13.jpg
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///storage/emulated/0/Download/spestovnik-simulation-ean13.jpg
            cd mobile && python3 scripts/smoke-android.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}
          path: |
            mobile/spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}.apk
            mobile/spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}.apk.sha256
            mobile/android-preview-${{ env.PREVIEW_SEQUENCE }}.png
            mobile/android-smoke.log
            mobile/android-smoke-window.xml
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: apk
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref_name != 'codex/preview-006' && github.ref_name != 'codex/preview-007'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREVIEW_SEQUENCE: ${{ needs.apk.outputs.preview_sequence }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v5
        with:
          name: spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}
          path: apk
      - name: Publish a new numbered prerelease without replacing assets
        shell: bash
        run: |
          APP_SOURCE_TREE="$(git rev-parse "${SOURCE_SHA}:mobile")"
          cd apk
          sha256sum -c "spestovnik-preview-${PREVIEW_SEQUENCE}.apk.sha256"
          TAG="android-preview-${PREVIEW_SEQUENCE}"
          if gh release view "$TAG" --json body --jq .body > previous-notes.md 2>/dev/null; then
            if grep -Fq "App tree: ${APP_SOURCE_TREE}." previous-notes.md; then
              echo "This app source is already published; preserving its existing assets."
              exit 0
            fi
            echo "A different app source already uses this number; increment mobile/preview.json and synchronize metadata."
            exit 1
          fi
          cat > notes.md <<EOF_NOTES
          Standalone Android 10+ test build. Source-backed grocery catalogue with metadata caching; camera/image/manual GTIN scanning; managed sign-in and private receipt OCR/review. Updated ordered overflow menu, nested Settings, About with installed version and Vimp notice, compact toolbars and five fuel choices. Earlier previews remain unchanged. Retailer names are not verified barcode/price coverage; demo images have no verified price. Real route directions and live Fuelo prices are not enabled.

          Numbered preview ${PREVIEW_SEQUENCE}. Source: ${SOURCE_SHA}. App tree: ${APP_SOURCE_TREE}. Build and Android 10 smoke checks passed before publication. Previous numbered artifacts are preserved.
          EOF_NOTES
          gh release create "$TAG" "spestovnik-preview-${PREVIEW_SEQUENCE}.apk" "spestovnik-preview-${PREVIEW_SEQUENCE}.apk.sha256" "android-preview-${PREVIEW_SEQUENCE}.png" --target "$SOURCE_SHA" --title "Спестовник — Android preview ${PREVIEW_SEQUENCE}" --notes-file notes.md --prerelease --latest=false
