name: Android preview APK
on:
  workflow_dispatch:
  push:
    branches: ["codex/android-preview-*"]
    paths: ["mobile/**", ".github/workflows/android-preview.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-preview.yml"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://spestoslav-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/test-model.cjs
      - run: npx expo install --check
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone preview APK (test signing)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Verify and name APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          cp "$APK" spestovnik-preview-001.apk
          sha256sum spestovnik-preview-001.apk > spestovnik-preview-001.apk.sha256
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Smoke test on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: |
            adb install mobile/spestovnik-preview-001.apk
            cd mobile && python3 scripts/smoke-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: spestovnik-preview-001
          path: |
            mobile/spestovnik-preview-001.apk
            mobile/spestovnik-preview-001.apk.sha256
            mobile/android-preview-001.png
            mobile/android-smoke.log
          retention-days: 30
          if-no-files-found: error
