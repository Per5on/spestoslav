name: Android preview APK
on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "Owner explicitly confirmed this internal preview build"
        type: boolean
        default: false
      prepare_bundle:
        description: "Also prepare and validate a test-signed Android App Bundle"
        type: boolean
        default: false
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-preview.yml"]
permissions:
  contents: read
jobs:
  apk:
    # Owner explicitly authorized Preview007 test builds on17November; no release approval.
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm_build == true) || (github.event_name == 'pull_request' && github.head_ref == 'codex/preview-007' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://spestoslav-api.onrender.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Record post-preview branch and conditional release decision
        if: github.head_ref == 'Test_postpreview-005' || github.ref_name == 'Test_postpreview-005'
        run: |
          echo "Candidate branch: Test_postpreview-005; experimental post-preview source, NOT an approved Preview 005 or 006 release."
          echo "Preview 005 remains pending on PR #9. Owner may separately choose Preview 006 after three complete backend/frontend/native verification passes."
          echo "Never bypass Android 10 barcode assertions, rename a 005 APK as 006, or replace earlier numbered releases."
          {
            echo "### Post-preview release gate"
            echo "Branch: Test_postpreview-005 (experimental; no automatic release approval)."
            echo "Preview 005: independent pending verification on PR #9."
            echo "Preview 006: conditional owner decision after 3 full verification passes; fresh metadata/build required."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record Preview 006 development gate
        if: github.head_ref == 'codex/preview-006' || github.ref_name == 'codex/preview-006'
        run: |
          echo "Preview 006 is a development candidate; automatic publication is blocked until three verification passes are complete."
          echo "### Preview 006 development candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Build/test only. No numbered release until three complete verification passes and final source review." >> "$GITHUB_STEP_SUMMARY"
      - name: Read preview metadata
        id: preview
        run: node scripts/read-preview.cjs
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo install --check
      - name: Prepare Android project for ARM phones
        run: npx expo prebuild --platform android --no-install
        env:
          SPESTOVNIK_DRY_ANDROID_SHRINK: "1"
      - name: Build phone preview APK (test signing)
        working-directory: mobile/android
        env:
          PREPARE_BUNDLE: ${{ inputs.prepare_bundle }}
        run: |
          tasks=(assembleRelease)
          if [[ "$PREPARE_BUNDLE" == true ]]; then
            tasks+=(bundleRelease)
          fi
          ./gradlew "${tasks[@]}" --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Verify phone APK signature, ABIs and size
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          ABIS=$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' | sort -u)
          test "$ABIS" = "$(printf '%s\n' arm64-v8a armeabi-v7a)"
          DEST="spestovnik-preview-${PREVIEW_SEQUENCE}.apk"
          cp "$APK" "$DEST"
          sha256sum "$DEST" > "$DEST.sha256"
          apk_bytes=$(wc -c < "$DEST")
          webp_bytes=$(unzip -v "$DEST" | awk '$NF ~ /[.]webp$/ { size += $3 } END { print size + 0 }')
          {
            echo "Signed ARM phone APK: $apk_bytes bytes (arm64-v8a, armeabi-v7a)"
            echo "Size difference from signed preview 10.8.1: $((apk_bytes - 43873698)) bytes"
            echo "Compressed WebP entries: $webp_bytes bytes (preview 10.8.1: 497272 bytes)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate test-signed ARM app bundle
        if: inputs.prepare_bundle == true
        run: |
          BUNDLE=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$BUNDLE"
          keytool -printcert -jarfile "$BUNDLE" > bundle-certificate.txt
          grep -F 'CN=Android Debug' bundle-certificate.txt
          ABIS=$(unzip -Z1 "$BUNDLE" | awk -F/ '$1 == "base" && $2 == "lib" && $4 ~ /\.so$/ {print $3}' | sort -u)
          test "$ABIS" = "$(printf '%s\n' arm64-v8a armeabi-v7a)"
          curl --fail --location --retry 3 --output bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar" | sha256sum --check
          java -jar bundletool.jar validate --bundle="$BUNDLE"
          DEST="spestovnik-preview-${PREVIEW_SEQUENCE}-test-signed.aab"
          cp "$BUNDLE" "$DEST"
          sha256sum "$DEST" > "$DEST.sha256"
          echo "Validated test-signed ARM app bundle: $(wc -c < "$DEST") bytes (arm64-v8a, armeabi-v7a)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: inputs.prepare_bundle == true
        with:
          name: spestovnik-bundle-${{ env.PREVIEW_SEQUENCE }}-test-signed
          path: |
            mobile/spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}-test-signed.aab
            mobile/spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}-test-signed.aab.sha256
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}
          path: |
            mobile/spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}.apk
            mobile/spestovnik-preview-${{ env.PREVIEW_SEQUENCE }}.apk.sha256
          retention-days: 30
          if-no-files-found: warn
