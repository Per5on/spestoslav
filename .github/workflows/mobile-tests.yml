name: Mobile verification

on:
  push:
    branches: [main]
    paths: [mobile/**, backend/**, data/**, scripts/**, .github/workflows/mobile-tests.yml]
  pull_request:
    paths: [mobile/**, backend/**, data/**, scripts/**, .github/workflows/mobile-tests.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            mobile/scripts/requirements-browser-tests.txt
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck -- --noUnusedLocals --noUnusedParameters && npm test
        working-directory: mobile
      - name: Verify Expo dependencies and Android JavaScript bundle
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_NO_DOTENV: "1"
        run: |
          npm exec -- expo install --check
          npm exec -- expo export --platform android --output-dir "$RUNNER_TEMP/android-export"
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r mobile/scripts/requirements-browser-tests.txt
      - run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y tesseract-ocr tesseract-ocr-bul fonts-dejavu-core
      - run: python mobile/scripts/verify-browser.py --output-dir "$RUNNER_TEMP/mobile-evidence"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mobile-verification
          path: ${{ runner.temp }}/mobile-evidence
          if-no-files-found: ignore
